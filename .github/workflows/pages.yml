name: Deploy demo site

# Publishes the self-contained demo page plus the two PDFs it links to.
# Layout mirrors results/final/ so the page's relative "../*.pdf" links resolve:
#   /demo/index.html (+ /demo/data/*.js), /MTP_Final_Report.pdf, /MTP_Final_Presentation.pdf, /MTP_Short_Report.pdf

on:
  push:
    branches: [main]
    paths:
      - "results/final/demo/**"
      - "results/final/MTP_Final_Report.pdf"
      - "results/final/MTP_Final_Presentation.pdf"
      - "results/final/MTP_Short_Report.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r results/final/demo _site/demo
          cp results/final/MTP_Final_Report.pdf results/final/MTP_Final_Presentation.pdf results/final/MTP_Short_Report.pdf _site/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>MTP demo</title>' \
            '<meta http-equiv="refresh" content="0; url=demo/">' \
            '<a href="demo/">Open the demo</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
